# Add these lines inside the server { } block for pony.games (and any test copy).
# They assume PHP-FPM is already set up for webhook.php; adjust the
# fastcgi_pass socket to match your existing PHP location block.

# Page addresses: /games -> games.php, /rules -> rules.php, ... (the query
# string comes along). The home page is index.php: the server block's "index"
# line must list index.php (aaPanel does by default).
# Old .html addresses redirect to the new ones, so shared links like
# /games.html?game=332 keep working (as /games?game=332).
# No trailing slash: /games/ is not a page.
rewrite ^/(games|upcoming|resources|requests|bounties|about|rules|account|login|logout|submit)$ /$1.php last;
rewrite ^/(games|upcoming|resources|bounties|about)\.html$ /$1 permanent;
rewrite ^/index\.html$ / permanent;

# Individual game pages: /game/123-some-title -> game.php
location ~ ^/game/([^/]+)/?$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/game.php;
    fastcgi_param QUERY_STRING slug=$1&$args;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # same as your existing PHP block
}

# Short links made in the admin (Stats -> Share links): /s/k3x9qa -> s.php
location ~ ^/s/([a-z0-9]+)/?$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/s.php;
    fastcgi_param QUERY_STRING c=$1;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Sitemap for search engines
location = /sitemap.xml {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/sitemap.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Moderation panel: /admin/ should run admin/index.php. If your server
# block's "index" line doesn't list index.php yet, this does it here.
location = /admin { return 301 /admin/; }
location = /admin/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
# /api/community.php is a normal .php file, your existing PHP block runs it.

# Never serve private files. Uses "=" and "^~", which win over the PHP
# location wherever that sits (aaPanel puts its own PHP rule first, so a
# "location ~" rule here would never be reached for .php files).
location = /.env { deny all; }
location = /.env.example { deny all; }
location ^~ /.git { deny all; }
location ^~ /inc/ { deny all; }
location ^~ /deploy/ { deny all; }
location ^~ /cron/ { deny all; }
location ^~ /storage/ { deny all; }          # database in the website folder: storage/community.sqlite
location ^~ /ponygames-data/ { deny all; }   # idem
location = /router.php { deny all; }
location = /README.md { deny all; }

# Old shared links like games.html?game=123 are redirected to /game/123 by
# js/main.js, so nothing is needed for those here.
